# =============================================================================
# rules/prod/agents.yaml - production allowlist (Koiosoft live workspace).
#
# Same fail-closed contract as every rule set: ids are ai_assistants.id (NOT
# user_id), unknown agents are never evaluated, and a channel without a prefix
# means "publish nothing".
#
# Verified against the production API on 2026-11-11:
#   id=2 "Sofia Liendo L."        (LiveChat)
#   id=3 "Sofia Liendo W."        (WhatsApp)
#   id=4 "Asistente de IA de Koiosoft" (email)
#
# Confirmed against the production database on 2026-11-13 (SELECT on ai_assistants
# joined with users): id/user_id pairs are 2/22, 3/23, 4/24, all enabled, and the
# bot team is id=4 " AI Agents".
# revive_team_id stays commented for this deploy: production has no automation rule
# whose trigger matches a team-4 assignment (rules 6/7/8 fire on assigned_team==1),
# so the revive post_action would silently do nothing. Correction still publishes.
# =============================================================================

agents:
  2:
    enabled: true
    name: "Sofia Liendo L."
    bot_user_id: 22
    prefixes:
      chat: "Pensando un poco mejor lo comentado..."
      email: "Para ser mas precisos, o con otro punto de vista"

  3:
    enabled: true
    name: "Sofia Liendo W. (WhatsApp)"
