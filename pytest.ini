[pytest]
testpaths = tests
pythonpath = .
addopts = -q
# El pipeline y los handlers son async. `auto` evita decorar cada prueba con
# @pytest.mark.asyncio; el scope function es suficiente porque no hay estado de loop
# compartido entre casos (STATE se limpia en un fixture autouse).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
