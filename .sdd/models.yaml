subagents:
  sdd-doc-updater:
    name: base.sdd-doc-updater
    model_options:
      - name: "default"
        model: "deepseek/deepseek-flash"
        priority: 1
        thinking: "off"
      - name: "cheap"
        model: "openrouter/deepseek/deepseek-v4-flash"
        priority: 2
        thinking: "off"
      - name: "fallback"
        model: "alibaba-token-intl/deepseek-v4-flash-0731"
        priority: 3
        thinking: "off"


  sdd-worker:
    name: base.sdd-worker
    model_options:
